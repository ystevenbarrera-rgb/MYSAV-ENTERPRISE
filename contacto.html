<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto MYSAV | Enterprise </title>

    <!-- Fuentes: Inter (textos principales) + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="background-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>

    <navbar-component></navbar-component>

    <main class="container page-content">
      <div class="contact-wrapper">
        <header class="header">
          <span class="badge">MYSAV ENTERPRISE</span>
          <h1>¿Cómo podemos ayudarte hoy?</h1>
          <p>Completa el formulario a continuación y nos pondremos en contacto contigo a la brevedad.</p>
        </header>

        <section class="card contact-card">
          <form id="contact-form" novalidate>
            <div class="form-grid">
              <div class="form-group">
                <label for="name">Nombre completo <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="Ej: Carlos Pérez" required />
              </div>

              <div class="form-group">
                <label for="email">Correo electrónico <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="ejemplo@dominio.com" required />
              </div>

              <div class="form-group">
                <label for="phone">Teléfono de contacto <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="+57 300 000 0000" required />
              </div>

              <div class="form-group">
                <label for="serviceType">Tipo de Servicio <span class="required">*</span></label>
                <select id="serviceType" name="serviceType" required>
                  <option value="" disabled selected>Selecciona una opción</option>
                  <option value="Soporte Técnico">Soporte Técnico</option>
                  <option value="Software">Desarrollo de Software</option>
                </select>
              </div>
            </div>

            <!-- Bloque dinámico de Soporte Técnico -->
            <div id="tech-support-fields" class="tech-fields-container hidden">
              <div class="tech-fields-header">
                <h3>Detalles del Equipo</h3>
                <p>Proporciónanos información sobre tu hardware para acelerar el proceso de diagnóstico.</p>
              </div>
              <div class="form-grid">
                <div class="form-group">
                  <label for="device">Tipo de Dispositivo <span class="required">*</span></label>
                  <input type="text" id="device" name="device" placeholder="Ej: Laptop, Servidor, PC de Escritorio" />
                </div>

                <div class="form-group">
                  <label for="brand">Marca del Equipo <span class="required">*</span></label>
                  <input type="text" id="brand" name="brand" placeholder="Ej: Lenovo, Dell, Apple" />
                </div>

                <div class="form-group">
                  <label for="quantity">Cantidad <span class="required">*</span></label>
                  <input type="number" id="quantity" name="quantity" placeholder="1" min="1" />
                </div>

                <div class="form-group">
                  <label for="year">Año (Opcional)</label>
                  <input type="number" id="year" name="year" placeholder="2023" min="1900" max="2099" />
                </div>
              </div>
            </div>

            <div class="form-group full-width">
              <label for="message">Mensaje <span class="required">*</span></label>
              <textarea id="message" name="message" rows="4" placeholder="Describe brevemente tus requerimientos o la consulta que deseas realizarnos..." required></textarea>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">
              <span class="btn-text">Enviar Mensaje</span>
              <div class="spinner hidden"></div>
            </button>
          </form>

          <div id="form-status" class="status-message"></div>
        </section>
      </div>
    </main>

    <!-- Botón flotante de WhatsApp -->
    <a
      href="https://wa.me/573227365952?text=Hola,%20quisiera%20más%20información%20sobre%20sus%20servicios"
      class="whatsapp-btn"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Contactar por WhatsApp"
    >

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
